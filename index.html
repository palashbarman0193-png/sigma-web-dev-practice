<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--Aj hum sikhne wale hai ki forms aur kia hota hai
    input tag form ke under
    form ek bohot hi important element hai kiuki form ke
    through hi data submit karte hai from client to server-->

    <!--Flight and railway ticket par jo apna date and time
    hai ki wo kaha se kab kaha jayega wo sab html form se hi submit kia jata hai-->

    <!-- Toh sabse pehle aata hai form jaise railway ka form ya
     neet ka form hum bharte hai taaki humara data untak
     pahunch sake jinko jarurat hai toh ye hota hai form-->



    <!-- Neeche forms ke kuch input tag diye gaye hai-->
</head>

<body>
    <h1>Form to apply for TA</h1>
    <div>
        <form action="post">
            <label for="username">USERNAME :- </label>
            <input type="text" id="username" name="username" placeholder="enter your username" autofocus>
    </div>

    <div>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        <label for="subscribe">subscribe to newsletter</label>
    </div>
    <div>
        <label for="comment">enter your comment</label>
        <textarea id="comment" name="comment" rows="4" cols="50"></textarea>
    </div>

    <div>
        <select name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="rather not to say">rather not to say</option>
        </select>
    </div>
    </form>

</body>

</html>
