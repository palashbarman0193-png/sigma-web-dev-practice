<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block Elements</title>
    <!-- Aaj hum sikhne wale hai inline and block elements
    inline wo elements wo hote hai jo utna jagah leta hai
    jitna zaroori hota hai aur block element wo hote hai jo
    screen ki puri width le lete hai isko display property
    bhi kehte hai aur ushe css ke through set kia ja sakta hai-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p>Hey i am a para</p> <!--yaha pe paragraph jo hai wo
    ek block element hai isiliye usne pura width le liya-->

    <a href="https://google.com">Google</a> <!--Aur ye href ek inline element hai
    isiliye isne itna hi width liya jitna ushe jarurat hai-->

</body>

</html>
