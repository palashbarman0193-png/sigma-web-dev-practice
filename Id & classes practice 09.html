<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID and Classes in HTML</title>
    <link rel="stylesheet" href="style.css">
    <!--Aaj hum sikhne wale hai id and class id ka simple matlab
    ye hai ki ek id ek se jyada use nahi ho sakta jaise ek
    aadhar card sirf ek insaan hi use kar sakta hai
    aur class ka matlab hai ki jaise ek 10th class me ek se jyada batcha
    padh sakta hai ushe hum class kehte hai-->
</head>

<body>
    <div id="firstdiv" class="red bg-yellow">first</div> <!--ye line me humne id ko samajne
    ki kosis kia hai jab humne id="firstdiv" likha toh iska matlab ab hum kisi
    aur line me ye same line nahi likh sakte kiuki id aadhar card jaisa hai
    ek number ek hi baar use ho sakta hai agar dusra id likhna hoga toh hum likhenge
    id="seconddiv" Aur agar css me id  ko style karna hoga toh hum # ka use karte hai-->
    
    <div id="seconddiv" class="red">second</div>
    <span class="red"></span>
    <!--classes id ka ulta hai clsses me hum bohot saari
    line ko ek sath use kar sakte hai jaise colour karna ya kuch aur Aur agar css me id  ko style karna hoga toh hum .(dot) ka use karte hai-->


    <!--Ab hum iske css se samajte hai ki id aur class kaise kaam karta hai
    jab humne .red{
color: rgb(255, 6, 6);
} kia tab first and second dono me red colour ho gaya kiuki wo dono ek hi class me the
 par jab humne #firstdiv{
   background-color: aqua;
} kia tab sirf pehli line ka background colour aqua hua kiuki wo ek id hai
 agar humne second line ka bhi background colour aqua karna hoga to hume
 ek aur line add karna hoga kuch aisa #seconddiv{
   background-color: aqua;
} jabki class me ek hi line se first and second dono red ho gaya tha-->
</body>

</html>
