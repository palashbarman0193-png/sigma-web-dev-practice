<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--Image add karne ke steps-->
    <img width="230" height="190" src="images.web.jpg" alt="">

    <!--br se ek gap aata hai-->
    <br>


    <!--Table add karne ke liye steps-->
    <table>
        <!--Humne is caption tag se table ka caption likha-->
        <caption>Employee Details</caption>
        <thead>
            <tr>
                <th>name</th>
                <th>Designation</th>
                <th>Fav Language</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Palash Barman</td>
                <td>Software Engineer</td>
                <td>Python</td>
            </tr>
        </tbody>

        <!--Yaha pe basically humne colspan se jod&sam ke liye 2 column ki jagah le liya-->
        <!--Aur rowspan se humne html ke liye 2 row ki jagha le liya -->

        <tfoot>
            <tr>
                <td colspan="2">Jod</td>
                <td rowspan="2">HTML</td>
            </tr>
            <tr>
                <td colspan="2">sam</td>

            </tr>
        </tfoot>

    </table>

    <!--List add karne ke liye steps-->

    <!--Sabse pehle unordered list add karne ke liye hum ul ka use karenge-->
    <!-- Yaha pe li ka matlab hai list item jisme hum list ke item likhenge-->
    <!--Unordered list ka matlab hai ki isme koi numbering nahi hoti-->
    <ul>
        <li>Palash</li>
        <li>Abhi</li>
        <li>Akash</li>
    </ul>

    <!--Ab humne ol kardia iska matlab ordered list jisme ab 1,2,3 aise numbering hogi-->

    <ol>
        <li>Palash</li>
        <li>Abhi</li>
        <li>Akash</li>
    </ol>

    <!-- Ordered list me agar hum 1,2,3 jaise numbering ki jagah agar hum chahe ki A,B,C ya I,II,III jaise aaye toh hum Type ki help se wo bhi kar sakte Hai-->
    <!-- Neeche jaise hi humne type="A" kia toh list me ab 1,2,3 ki jagah A,B,C aise aayega-->


    <ol type="A">
        <li>Palash</li>
        <li>Abhi</li>
        <li>Akash</li>
    </ol>





</body>

</html>
